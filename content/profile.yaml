name: Damien Huzard
degree: PhD
title: Neuroscientist & Founder
tagline: "Pushing for a description over an interpretation of data."
bio: >
  I am a neuroscientist dedicated to bridging the gap between preclinical research
  and digital interoperability. I pioneer the FAIRRR framework—integrating FAIR data
  principles with the 3Rs (Replace, Reduce, Refine)—to ensure preclinical research
  is as ethical as it is reproducible.
